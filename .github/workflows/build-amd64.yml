name: Build Linux AMD64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AMD64 ELF
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install ZIP utility
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build release executable
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Verify ELF architecture
        run: |
          executable="target/x86_64-unknown-linux-gnu/release/typelua"
          file "$executable"
          readelf -h "$executable" | grep -F "Advanced Micro Devices X86-64"
          test -x "$executable"

      - name: Package executable
        id: package
        run: |
          archive="typelua-linux-x86_64.zip"
          executable="target/x86_64-unknown-linux-gnu/release/typelua"

          mkdir package
          cp "$executable" package/typelua-x86_64

          (
            cd package
            zip "../$archive" typelua-x86_64
          )

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: typelua-linux-x86_64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
