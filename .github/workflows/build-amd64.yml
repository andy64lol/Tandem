name: Build Tandem Linux AMD64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Tandem AMD64 ELF
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release executable
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Verify ELF architecture
        run: |
          executable="target/x86_64-unknown-linux-gnu/release/tandem"
          file "$executable"
          readelf -h "$executable" | grep -F "Advanced Micro Devices X86-64"
          test -x "$executable"

      - name: Prepare executable
        id: package
        run: |
          executable="target/x86_64-unknown-linux-gnu/release/tandem"
          cp "$executable" tandem-x86_64
          echo "executable=tandem-x86_64" >> "$GITHUB_OUTPUT"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: tandem-linux-x86_64
          path: ${{ steps.package.outputs.executable }}
          if-no-files-found: error

  package:
    name: Package Tandem AMD64 tarball
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: tandem-linux-x86_64
          path: dist

      - name: Build Arch tarball
        run: make package-arch-binary BINARY_PATH=dist/tandem-x86_64 ARCH=x86_64

      - name: Upload Arch tarball
        uses: actions/upload-artifact@v4
        with:
          name: tandem-linux-x86_64-arch
          path: dist/*.tar.gz
          if-no-files-found: error
