[package]
name = "tandem"
version = "0.2.0"
edition = "2021"
description = "Tandem: a small strictly typed, C-style language that transpiles to Lua 5.4"
license = "MIT"

[features]
default = ["runtime"]
runtime = ["dep:mlua", "dep:mlua-pkg"]

[dependencies]
mlua = { version = "0.12", features = ["lua54", "vendored"], optional = true }
mlua-pkg = { version = "0.11.0", optional = true }
serde = "1.0"
serde_json = "1.0"
